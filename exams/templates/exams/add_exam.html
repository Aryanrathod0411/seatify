<!DOCTYPE html>
<html>

<head>

    <title>SEATIFY - Add Exam</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #0c1c33;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #0c1c33;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #0c1c33;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #17365d;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0c1c33;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>SEATIFY</h1>

        <p>
            Smart Exam Seating Management System
        </p>

    </div>


    <div class="container">


        <div class="card">


            <h2>{% if exam %}Edit Exam{% else %}Add Exam{% endif %}</h2>


            <form method="POST">

                {% csrf_token %}


                {{ form.as_p }}
                <button type="submit">{% if exam %}Save Changes{% else %}Add Exam{% endif %}</button>


            </form>

            <a href="{% url 'admin_panel' %}" class="back-btn">
                Back to Dashboard
            </a>

            <a
                href="{% url 'exam_list' %}"
                class="back-btn"
            >
                ← Back to Exams
            </a>


        </div>


    </div>


</body>

</html>
