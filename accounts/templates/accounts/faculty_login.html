<!DOCTYPE html>
<html>
<head>
    <title>SEATIFY - Faculty Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #0c1c33;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #0c1c33;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            background: #0c1c33;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #17365d;
        }

        .back-container {
            text-align: center;
            margin-top: 16px;
        }

        .back-button {
            display: inline-block;
            padding: 8px 20px;
            background: white;
            color: #0c1c33;
            border: 1px solid #c8d0da;
            border-radius: 6px;
            font-size: 14px;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #f0f3f7;
            border-color: #0c1c33;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>SEATIFY</h1>
        <p>Smart Exam Seating Management System</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Faculty Login</h2>

            <form method="POST">

                {% csrf_token %}

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

            <div class="back-container">
                <a href="/" class="back-button">
                    ← BACK
                </a>
            </div>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

        </div>

    </div>

</body>
</html>
